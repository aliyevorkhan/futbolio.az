name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: futbolio
          POSTGRES_USER: futbolio
          POSTGRES_PASSWORD: futbolio-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U futbolio" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgres://futbolio:futbolio-test-password@localhost:5432/futbolio
      REDIS_URL: redis://localhost:6379/0
      TURNSTILE_BYPASS: "True"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - name: Install Python deps
        run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy . || true  # advisory until the type-stub pass is complete
      - name: makemigrations --check
        run: python manage.py makemigrations --check --dry-run
      - name: pytest
        run: pytest --cov
      - name: pip-audit (advisory)
        run: pip-audit -r requirements.txt || true

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: futbolio
          POSTGRES_USER: futbolio
          POSTGRES_PASSWORD: futbolio-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U futbolio" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    # No object-storage service here — the files app's tests mock
    # common.storage/common.clamav calls rather than hitting a real
    # S3-compatible backend (see docker/garage/README.md for why local
    # dev/prod use Garage instead of MinIO; CI doesn't need either).
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key
      DATABASE_URL: postgres://futbolio:futbolio-test-password@localhost:5432/futbolio
      REDIS_URL: redis://localhost:6379/0
      TURNSTILE_BYPASS: "True"
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: backend
        run: |
          sudo apt-get update && sudo apt-get install -y libmagic1
          pip install -r requirements.txt
      - name: Migrate + run backend in background
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          nohup python manage.py runserver 0.0.0.0:8000 &
          sleep 3
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Check generated API types are not stale
        working-directory: frontend
        run: |
          npm run generate:types
          git diff --exit-code -- lib/api/generated/schema.d.ts
      - name: npm audit (advisory)
        working-directory: frontend
        run: npm audit --audit-level=high || true
      - name: eslint
        working-directory: frontend
        run: npm run lint
      - name: tsc --noEmit
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Brand color guard (text on green must never be white)
        working-directory: frontend
        run: |
          if grep -rn "bg-brand-green" components app | grep "text-white"; then
            echo "Found text-white paired with bg-brand-green — spec requires text-brand-dark on green."
            exit 1
          fi
      - name: vitest
        working-directory: frontend
        run: npm run test:unit
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e
        working-directory: frontend
        run: npx playwright test
