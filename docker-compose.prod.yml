# Production override — apply alongside the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Host ports are controlled by BACKEND_PORT/FRONTEND_PORT/MAILPIT_WEB_PORT in
# .env (defaults 8000/3000/8025 for local dev) — set them in a production
# .env to whatever the box's reverse proxy/tunnel expects. This file only
# tunes the backend's run command for a production-sized worker count.
# Note: Compose merges list-valued keys (ports/volumes) across -f files by
# concatenation, not replacement, so port/volume differences belong in env
# vars or the base file, never as a list override here.

services:
  backend:
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 60"
