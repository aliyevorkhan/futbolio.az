x-backend-env: &backend-env
  env_file:
    - .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-futbolio}
      POSTGRES_USER: ${POSTGRES_USER:-futbolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-futbolio-dev-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-futbolio} -d ${POSTGRES_DB:-futbolio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-futbolio-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-futbolio-minio-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-futbolio-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-futbolio-minio-secret}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-futbolio-uploads}
    entrypoint: ["/bin/sh", "/init/init-entrypoint.sh"]
    volumes:
      - ./docker/minio/init-entrypoint.sh:/init/init-entrypoint.sh:ro
    restart: "no"

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamavdata:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 180s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  backend:
    <<: *backend-env
    build:
      context: ./backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/public/settings/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy

  celery-worker:
    <<: *backend-env
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A config worker -Q default -l info
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy

  celery-worker-media:
    <<: *backend-env
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A config worker -Q media -l info --concurrency=2
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
      clamav:
        condition: service_healthy

  celery-beat:
    <<: *backend-env
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-994558850709}
        NEXT_PUBLIC_WHATSAPP_DEFAULT_TEXT: ${NEXT_PUBLIC_WHATSAPP_DEFAULT_TEXT:-Salam, oyunçu lazımdır}
        NEXT_PUBLIC_ANALYTICS_PROVIDER: ${NEXT_PUBLIC_ANALYTICS_PROVIDER:-}
        NEXT_PUBLIC_ANALYTICS_SITE_ID: ${NEXT_PUBLIC_ANALYTICS_SITE_ID:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  clamavdata:
