x-backend-env: &backend-env
  env_file:
    - .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-futbolio}
      POSTGRES_USER: ${POSTGRES_USER:-futbolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-futbolio-dev-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-futbolio} -d ${POSTGRES_DB:-futbolio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage. MinIO's Docker images are no longer
  # freely pullable (Docker Hub and Quay both deny anonymous pulls as of
  # late 2025/2026), so local dev + this stack use Garage instead — a
  # lightweight, actively maintained, fully open-source (AGPLv3)
  # S3-compatible server. See docker/garage/README.md for the one-time
  # bootstrap (layout/bucket/key) a fresh environment needs to run once.
  garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    # Must be reachable from the BROWSER, not just from other containers:
    # presigned upload URLs handed to the client point at whatever host
    # AWS_S3_PUBLIC_ENDPOINT_URL names, and that host has to resolve to
    # this port from outside the compose network too (see
    # docker/garage/README.md's "public endpoint" section).
    ports:
      - "127.0.0.1:${GARAGE_PORT:-3900}:3900"
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamavdata:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 180s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"

  backend:
    <<: *backend-env
    build:
      context: ./backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py configure_storage_cors &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/public/settings/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      garage:
        condition: service_healthy

  celery-worker:
    <<: *backend-env
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A config worker -Q default -l info
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy

  celery-worker-media:
    <<: *backend-env
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A config worker -Q media -l info --concurrency=2
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
      clamav:
        condition: service_healthy

  celery-beat:
    <<: *backend-env
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-994558850709}
        NEXT_PUBLIC_WHATSAPP_DEFAULT_TEXT: ${NEXT_PUBLIC_WHATSAPP_DEFAULT_TEXT:-Salam, oyunçu lazımdır}
        NEXT_PUBLIC_ANALYTICS_PROVIDER: ${NEXT_PUBLIC_ANALYTICS_PROVIDER:-}
        NEXT_PUBLIC_ANALYTICS_SITE_ID: ${NEXT_PUBLIC_ANALYTICS_SITE_ID:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  garagemeta:
  garagedata:
  clamavdata:
